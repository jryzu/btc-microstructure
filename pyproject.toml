[project]
name = "btc-microstructure"
version = "0.1.0"
description = "BTC/USDT order-book microstructure research: does imbalance survive execution costs?"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
